und Ikaros; antiker Quellentext."},"family":{"title":"Theoi: Götter-Stammbäume","url":"https://www.theoi.com/Tree.html","note":"Vergleich der verschiedenen antiken Familienüberlieferungen."},"zeus":{"title":"Theoi: Zeus","url":"https://www.theoi.com/Olympios/Zeus.html","note":"Zeus und seine Attribute, mit Belegen aus antiken Texten."},"alphabet":{"title":"Greek Language and Linguistics: Alphabet","url":"https://www.greek-language.com/Alphabet.html","note":"Trennung von neugriechischer und altgriechischer Aussprache; Buchstabenverbindungen."},"lexicon":{"title":"Zentrum für die griechische Sprache: Wörterbuch","url":"https://www.greek-language.gr/greekLang/modern_greek/tools/lexica/triantafyllides/index.html","note":"Neugriechische Wörter und Schreibweisen. Deutsche Erklärungen und Lesehilfen wurden eigens formuliert."},"coast":{"title":"GSHHG / Basemap: Küstengeometrie","url":"https://www.soest.hawaii.edu/pwessel/gshhg/","note":"GSHHG via Basemap Data 2.0; Ausschnitt vereinfacht und neu gestaltet. LGPL-3.0-or-later. Ortsmarken ungefähr; keine Navigationskarte."},"apollodorus3":{"title":"Apollodor: Bibliotheke, Buch 3","url":"https://www.theoi.com/Text/Apollodorus3.html","note":"Antiker Quellentext zu Europa, Minos und Athenes Geschenk."},"hymnhermes":{"title":"Homerischer Hymnos an Hermes","url":"https://www.theoi.com/Text/HomericHymns2.html","note":"Antiker Quellentext: Hermes, die Leier und Apollon."},"hymndemeter":{"title":"Homerischer Hymnos an Demeter","url":"https://www.theoi.com/Text/HomericHymns1.html","note":"Antiker Quellentext: Demeter und Persephone."}},"gods":[{"id":"zeus","name":"Zeus","greek":"Ζεύς","role":"Der Herr des Himmels","cat":"Goetter","symbol":"bolt","tone":"gold","desc":"Zeus ist in den alten Sagen der Herr des Himmels und der Anführer der Götter. Sein berühmtestes Zeichen ist der Blitz. Die Griechen erzählten sich, dass er über Wolken, Regen und Gewitter herrscht.","fact":"Auch der mächtige Zeus war einmal ein Baby: Auf Kreta soll er in einer Höhle versteckt worden sein.","family":"Rhea und Kronos sind seine Eltern. Poseidon, Hades, Hera, Demeter und Hestia sind seine Geschwister.","links":["rhea","kronos","poseidon","hera"],"story":"babyzeus","place":"dikte","source":["zeus","apollodorus"]},{"id":"poseidon","name":"Poseidon","greek":"Ποσειδών","role":"Der Herr des Meeres","cat":"Goetter","symbol":"trident","tone":"aqua","desc":"Poseidon ist der Gott des Meeres. Die Menschen baten ihn um ruhige Wellen für ihre Schiffe. In den Sagen kann er mit seinem Dreizack das Meer aufwühlen und die Erde erschüttern.","fact":"Sein Dreizack hat genau drei Spitzen. Auch Pferde gehören zu seinen Zeichen.","family":"Er ist ein Sohn von Rhea und Kronos und ein Bruder von Zeus und Hades.","links":["zeus","hades","rhea"],"story":null,"place":null,"source":["hesiod","family"]},{"id":"athene","name":"Athene","greek":"Αθηνά","role":"Die kluge Beschützerin","cat":"Goetter","symbol":"owl","tone":"sage","desc":"Athene steht für kluge Ideen, Handwerk und geschicktes Planen. Ihre Geschichten zeigen: Mit Denken kommt man oft weiter als mit blosser Kraft. Eine Eule begleitet sie als Zeichen der Weisheit.","fact":"Athen, die Hauptstadt Griechenlands, trägt ihren Namen. In einer Sage schenkt Athene der Stadt einen Olivenbaum.","family":"Zeus und die kluge Metis sind ihre Eltern. Die Sage erzählt eine wunderliche Geburt aus Zeus’ Kopf.","links":["zeus"],"story":"olive","place":null,"source":["hesiod","family"]},{"id":"hera","name":"Hera","greek":"Ήρα","role":"Die Königin der Götter","cat":"Goetter","symbol":"crown","tone":"rose","desc":"Hera ist die Königin der Götter. Sie beschützt in den Sagen die Ehe und Hochzeiten. Sie ist stolz und sehr mächtig – und mit Zeus nicht immer einer Meinung.","fact":"Ein Pfau mit einem prächtigen Federrad ist eines ihrer bekannten Zeichen.","family":"Ihre Eltern sind Rhea und Kronos. Zeus ist in der Götterwelt sowohl ihr Bruder als auch ihr Mann. Solche Sagenfamilien sind keine Vorbilder für echte Familien.","links":["zeus","rhea","ares","hephaistos"],"story":null,"place":null,"source":["hesiod","family"]},{"id":"hades","name":"Hades","greek":"Άδης","role":"Der Hüter der Unterwelt","cat":"Goetter","symbol":"key","tone":"lilac","desc":"Hades herrscht über die Unterwelt. So nannten die alten Griechen den Ort, an den die Verstorbenen in ihren Geschichten kommen. Er ist nicht einfach ein böser Gott, sondern hat eine besondere Aufgabe.","fact":"Sein Wachhund Kerberos hat in vielen Darstellungen drei Köpfe.","family":"Zeus und Poseidon sind seine Brüder. Persephone ist seine Frau.","links":["zeus","poseidon","persephone"],"story":"seasons","place":null,"source":["hesiod","family"]},{"id":"demeter","name":"Demeter","greek":"Δήμητρα","role":"Die Hüterin des Getreides","cat":"Goetter","symbol":"wheat","tone":"gold","desc":"Demeter ist die Göttin des Getreides und der Landwirtschaft. Die Menschen baten sie um eine gute Ernte. Ohne Korn gäbe es schliesslich kein Brot.","fact":"Ihre Geschichte mit Persephone erklärt in der Sagenwelt, warum Pflanzen wachsen und wieder ruhen.","family":"Sie ist eine Tochter von Rhea und Kronos. Persephone ist ihre Tochter.","links":["persephone","rhea","zeus"],"story":"seasons","place":null,"source":["hesiod","family"]},{"id":"hestia","name":"Hestia","greek":"Εστία","role":"Die Wärme des Zuhauses","cat":"Goetter","symbol":"flame","tone":"coral","desc":"Hestia ist die Göttin des Herdfeuers. Früher wurde am Feuer gekocht, und es wärmte das Haus. Hestia steht deshalb auch für Zuhause und Zusammenhalt.","fact":"Nicht jede Gottheit erlebt wilde Abenteuer. Hestias Aufgabe ist leise, aber sehr wichtig.","family":"Sie ist eine Tochter von Rhea und Kronos und eine Schwester von Zeus.","links":["rhea","zeus"],"story":null,"place":null,"source":["hesiod","family"]},{"id":"apollon","name":"Apollon","greek":"Απόλλων","role":"Musik, Licht und Können","cat":"Goetter","symbol":"lyre","tone":"gold","desc":"Apollon ist ein Gott der Musik, des Bogenschiessens und der Weissagung. Er wird oft mit einer Leier gezeigt. Das ist ein kleines Saiteninstrument, das man zupft.","fact":"Apollon und Artemis sind Zwillinge. Apollon ist mit Licht verbunden; der Sonnengott heisst in vielen alten Sagen aber Helios.","family":"Zeus und Leto sind seine Eltern. Artemis ist seine Zwillingsschwester.","links":["artemis","zeus","hermes"],"story":"hermes","place":null,"source":["hesiod","family"]},{"id":"artemis","name":"Artemis","greek":"Άρτεμις","role":"Unterwegs in der Wildnis","cat":"Goetter","symbol":"bow","tone":"sage","desc":"Artemis ist die Göttin der Jagd und der wilden Tiere. In den Sagen streift sie mit Pfeil und Bogen durch Wälder und Berge. Oft wird ein Hirsch neben ihr gezeigt.","fact":"Artemis und Apollon sind Zwillinge – haben aber ganz unterschiedliche Lieblingsaufgaben.","family":"Ihre Eltern sind Zeus und Leto. Apollon ist ihr Zwillingsbruder.","links":["apollon","zeus"],"story":null,"place":null,"source":["hesiod","family"]},{"id":"hermes","name":"Hermes","greek":"Ερμής","role":"Der flinke Götterbote","cat":"Goetter","symbol":"wing","tone":"aqua","desc":"Hermes bringt Nachrichten von einem Gott zum anderen. Er beschützt Reisende und ist für seine schlauen Einfälle bekannt. In Bildern trägt er oft geflügelte Sandalen.","fact":"Schon als Baby soll er eine Leier erfunden haben. Ein erstaunlich musikalischer kleiner Götterbote!","family":"Zeus und Maia sind seine Eltern.","links":["zeus","apollon"],"story":"hermes","place":null,"source":["hesiod","family"]},{"id":"ares","name":"Ares","greek":"Άρης","role":"Die wilde Kraft","cat":"Goetter","symbol":"shield","tone":"coral","desc":"Ares ist der Gott des Krieges. Er steht für die wilde, ungestüme Seite des Kämpfens. Die Sagen zeigen auch, dass viel Kraft nicht automatisch eine gute Idee bedeutet.","fact":"Athene plant klug, Ares stürmt eher los. Daran erkennt man, wie verschieden die Götter sind.","family":"Zeus und Hera sind seine Eltern.","links":["zeus","hera","athene"],"story":null,"place":null,"source":["hesiod","family"]},{"id":"hephaistos","name":"Hephaistos","greek":"Ήφαιστος","role":"Der geniale Erfinder","cat":"Goetter","symbol":"hammer","tone":"coral","desc":"Hephaistos ist der Gott des Feuers und der Schmiedekunst. In seiner Werkstatt entstehen aussergewöhnliche Gegenstände für die Götter. Er ist ein Meister im Bauen und Erfinden.","fact":"Die Sagen erzählen von selbst fahrenden Dreifüssen und goldenen Helferinnen – fast wie von Robotern.","family":"Hera ist seine Mutter. Manche Sagen nennen Zeus als Vater, andere erzählen, Hera habe ihn allein bekommen.","links":["hera","zeus","talos"],"story":null,"place":null,"source":["hesiod","family"]},{"id":"aphrodite","name":"Aphrodite","greek":"Αφροδίτη","role":"Liebe und Schönheit","cat":"Goetter","symbol":"shell","tone":"rose","desc":"Aphrodite ist die Göttin der Liebe und Schönheit. In den Geschichten spielt sie oft eine Rolle, wenn Menschen oder Götter sich verlieben. Muscheln und Tauben passen zu ihren Bildern.","fact":"Eine berühmte Sage erzählt, dass sie aus dem Schaum des Meeres entstand.","family":"Ihre Herkunft wird unterschiedlich erzählt: Bei Hesiod entsteht sie aus Meeresschaum; bei Homer sind Zeus und Dione ihre Eltern.","links":["zeus"],"story":null,"place":null,"source":["hesiod","family"]},{"id":"dionysos","name":"Dionysos","greek":"Διόνυσος","role":"Theater und Feste","cat":"Goetter","symbol":"theatre","tone":"lilac","desc":"Dionysos ist mit Weinreben, Festen und dem Theater verbunden. Bei Festen für ihn wurden im alten Griechenland Theaterstücke aufgeführt. Dazu gehörten auch Masken.","fact":"In einer Sage wird Ariadne seine Frau. So ist auch dieser Gott mit einer Geschichte aus Kreta verbunden.","family":"Zeus und Semele sind seine Eltern.","links":["zeus","ariadne"],"story":null,"place":null,"source":["hesiod","family"]},{"id":"persephone","name":"Persephone","greek":"Περσεφόνη","role":"Zwischen zwei Welten","cat":"Goetter","symbol":"flower","tone":"rose","desc":"Persephone ist die Tochter der Erntegöttin Demeter. In einer bekannten Sage lebt sie einen Teil des Jahres bei ihrer Mutter und einen Teil bei Hades in der Unterwelt.","fact":"Der Granatapfel spielt eine wichtige Rolle in ihrer Geschichte.","family":"Demeter und Zeus sind ihre Eltern. Hades ist ihr Mann.","links":["demeter","hades","zeus"],"story":"seasons","place":null,"source":["hesiod","family"]},{"id":"gaia","name":"Gaia","greek":"Γαία","role":"Die Erde als Göttin","cat":"Ursprung","symbol":"leaf","tone":"sage","desc":"Gaia ist in den alten Schöpfungssagen die Erde selbst. Aus ihr entstehen viele Wesen und Gottheiten. Sie gehört zu einer viel älteren Generation als Zeus.","fact":"Der Name Gaia taucht noch heute auf, wenn Menschen über die Erde sprechen.","family":"Gaia und Uranos sind die Eltern vieler Titanen, darunter Kronos und Rhea.","links":["uranos","kronos","rhea"],"story":null,"place":null,"source":["hesiod","family"]},{"id":"uranos","name":"Uranos","greek":"Ουρανός","role":"Der Himmel der Urzeit","cat":"Ursprung","symbol":"stars","tone":"aqua","desc":"Uranos verkörpert in der griechischen Sagenwelt den Himmel. Zusammen mit Gaia, der Erde, gehört er zur allerersten grossen Götterfamilie.","fact":"Das heutige griechische Wort «ουρανός» bedeutet Himmel.","family":"Mit Gaia ist er der Vater der Titanen Kronos und Rhea.","links":["gaia","kronos","rhea"],"story":null,"place":null,"source":["hesiod","family"]},{"id":"kronos","name":"Kronos","greek":"Κρόνος","role":"Ein Titan vor Zeus","cat":"Ursprung","symbol":"mountain","tone":"lilac","desc":"Kronos ist ein Titan. So heisst die Göttergeneration vor Zeus. Er will seine Macht nicht abgeben. Doch Rhea schafft es, ihren jüngsten Sohn Zeus vor ihm zu verstecken.","fact":"Kronos ist nicht dasselbe wie Chronos, die Verkörperung der Zeit. Die ähnlichen Namen werden oft verwechselt.","family":"Gaia und Uranos sind seine Eltern. Mit Rhea hat er sechs berühmte Kinder.","links":["gaia","uranos","rhea","zeus"],"story":"babyzeus","place":null,"source":["hesiod","family"]},{"id":"rhea","name":"Rhea","greek":"Ρέα","role":"Die mutige Mutter","cat":"Ursprung","symbol":"leaf","tone":"sage","desc":"Rhea ist eine Titanin und die Mutter von Zeus. Sie möchte ihr Baby beschützen und versteckt es in einer Höhle auf Kreta. Mit einer List täuscht sie Kronos.","fact":"Rhea wickelt in der Sage einen Stein in Babysachen. Kronos bemerkt den Trick nicht.","family":"Gaia und Uranos sind ihre Eltern. Mit Kronos hat sie Hestia, Demeter, Hera, Hades, Poseidon und Zeus.","links":["kronos","zeus","hera"],"story":"babyzeus","place":"dikte","source":["hesiod","family"]},{"id":"minos","name":"Minos","greek":"Μίνως","role":"Der sagenhafte König","cat":"Menschen","symbol":"crown","tone":"gold","desc":"Minos ist in den Sagen ein König von Kreta. Sein Palast wird mit Knossos verbunden. Er beauftragt den Erfinder Daidalos, das berühmte Labyrinth zu bauen.","fact":"Die minoische Kultur wurde nach dem sagenhaften Minos benannt. Ein gefundener Palast beweist aber nicht, dass alle Sagen wahr sind.","family":"Zeus und Europa sind in der Sage seine Eltern. Ariadne ist seine Tochter.","links":["zeus","europa","ariadne","daidalos"],"story":"thread","place":"knossos","source":["heroes","knossos"]},{"id":"ariadne","name":"Ariadne","greek":"Αριάδνη","role":"Die Heldin mit dem Faden","cat":"Menschen","symbol":"thread","tone":"coral","desc":"Ariadne lebt in der Sage auf Kreta. Sie hilft Theseus, aus dem verwirrenden Labyrinth zurückzufinden. Ihre wichtigste Hilfe ist kein Zauberschwert, sondern ein einfaches Fadenknäuel.","fact":"Ein «Ariadnefaden» ist noch heute ein Bild für eine Hilfe, die durch etwas Schwieriges führt.","family":"Ihre Eltern sind Minos und Pasiphae.","links":["minos","theseus","dionysos"],"story":"thread","place":"knossos","source":["heroes"]},{"id":"theseus","name":"Theseus","greek":"Θησεύς","role":"Der Held im Labyrinth","cat":"Menschen","symbol":"shield","tone":"aqua","desc":"Theseus reist in der Sage von Athen nach Kreta. Im Labyrinth begegnet er dem Minotauros. Mut allein reicht aber nicht: Ariadnes Faden hilft ihm, den Ausgang wiederzufinden.","fact":"Ohne Ariadnes Hilfe wäre sein Abenteuer wohl ganz anders ausgegangen. Helden brauchen ein Team.","family":"In den Sagen gilt Aigeus als sein menschlicher Vater; manche nennen auch Poseidon als göttlichen Vater.","links":["ariadne","minotauros","poseidon"],"story":"thread","place":"knossos","source":["heroes"]},{"id":"daidalos","name":"Daidalos","greek":"Δαίδαλος","role":"Der Meister der Ideen","cat":"Menschen","symbol":"hammer","tone":"gold","desc":"Daidalos ist ein berühmter Erfinder und Baumeister. Für Minos baut er in der Sage das Labyrinth. Später fertigt er Flügel aus Federn und Wachs, um Kreta zu verlassen.","fact":"Seine Geschichte stellt eine spannende Frage: Was kann eine Erfindung – und wo sind ihre Grenzen?","family":"Ikaros ist sein Sohn.","links":["ikaros","minos"],"story":"wings","place":"knossos","source":["heroes"]},{"id":"ikaros","name":"Ikaros","greek":"Ίκαρος","role":"Der Junge mit den Flügeln","cat":"Menschen","symbol":"wing","tone":"aqua","desc":"Ikaros fliegt in der Sage mit Flügeln, die sein Vater Daidalos gebaut hat. Obwohl er gewarnt wird, steigt er zu hoch. Die Geschichte hat ein trauriges Ende.","fact":"Menschen können nicht mit angeklebten Federn fliegen. Das ist eine Sage, keine Bauanleitung.","family":"Daidalos ist sein Vater.","links":["daidalos"],"story":"wings","place":null,"source":["heroes"]},{"id":"europa","name":"Europa","greek":"Ευρώπη","role":"Eine Reise übers Meer","cat":"Menschen","symbol":"boat","tone":"rose","desc":"Europa ist eine Prinzessin in einer alten Sage. Zeus verwandelt sich in einen weissen Stier und trägt sie über das Meer nach Kreta. Dort beginnt ein neuer Teil ihrer Geschichte.","fact":"Die Sage verbindet Europa, Zeus und Kreta. Die Herkunft des Kontinentnamens ist damit aber nicht einfach bewiesen.","family":"Minos ist in der Sage ein Sohn von Europa und Zeus.","links":["zeus","minos"],"story":"europa","place":null,"source":["family","zeus"]},{"id":"minotauros","name":"Minotauros","greek":"Μινώταυρος","role":"Das Wesen im Labyrinth","cat":"Wesen","symbol":"bull","tone":"coral","desc":"Der Minotauros ist ein erfundenes Wesen mit menschlichem Körper und Stierkopf. In der Sage lebt er im Labyrinth von Kreta. Theseus wagt sich hinein und besiegt ihn.","fact":"Der Palast von Knossos ist echt. Ein echter Minotauros wurde dort nie nachgewiesen.","family":"Pasiphae und der kretische Stier werden in der Sage als seine Eltern genannt.","links":["theseus","ariadne","minos"],"story":"thread","place":"knossos","source":["heroes","knossos"]},{"id":"talos","name":"Talos","greek":"Τάλως","role":"Der bronzene Inselwächter","cat":"Wesen","symbol":"robot","tone":"gold","desc":"Talos ist in einer Sage ein riesiger Wächter aus Bronze. Er umrundet Kreta und hält unerwünschte Schiffe fern. Bronze ist ein Metallgemisch – kein Zauberstoff.","fact":"Talos soll die Insel dreimal am Tag umrundet haben. Er erinnert an einen Roboter, lange bevor es Computer gab.","family":"Seine Herkunft wird verschieden erzählt. In manchen Fassungen ist er ein Werk von Hephaistos.","links":["hephaistos"],"story":"talos","place":null,"source":["apollodorus"]},{"id":"amaltheia","name":"Amaltheia","greek":"Αμάλθεια","role":"Die Helferin des kleinen Zeus","cat":"Wesen","symbol":"goat","tone":"sage","desc":"In einer bekannten Fassung der Zeus-Sage ist Amaltheia eine Ziege. Sie gibt dem versteckten Baby Zeus Milch. So bekommt selbst der künftige Götterkönig Hilfe von einem Tier.","fact":"Andere Fassungen beschreiben Amaltheia als eine Nymphe, also ein Naturwesen. Sagen gibt es oft in mehreren Versionen.","family":"Sie gehört zu den Helferinnen, die Zeus auf Kreta versorgen.","links":["zeus","rhea"],"story":"babyzeus","place":"dikte","source":["apollodorus","cave"]}],"stories":[{"id":"babyzeus","title":"Das Baby in der Höhle","sub":"Wie eine Mutter den späteren Götterkönig rettet.","symbol":"bolt","tone":"gold","sections":[["Ein geheimer Ort","Vor langer Zeit, so erzählt die Sage, fürchtet der Titan Kronos um seine Macht. Seine Frau Rhea will ihr Baby Zeus vor ihm beschützen. Sie bringt es in eine Höhle auf Kreta."],["Der Steintrick","Rhea wickelt einen Stein in Babysachen und gibt ihn Kronos. Er lässt sich täuschen. Das echte Baby ist inzwischen gut versteckt."],["Milch und laute Schilde","Helferinnen kümmern sich um Zeus. In einer Fassung gibt ihm die Ziege Amaltheia Milch. Die Kureten, mythische Wächter, schlagen laut auf ihre Schilde, damit niemand das Weinen hört."],["Eine Insel voller Spuren","Zeus wächst heran und wird später zum Herrscher der Götter. Auf Kreta verbindet man mehr als eine Höhle mit seiner Kindheit. Die Höhle von Psychro ist eine davon."]],"think":"Was war wichtiger: Rheas Kraft oder ihre kluge Idee?","people":["rhea","zeus","amaltheia","kronos"],"source":["apollodorus","cave"],"place":"dikte","note":null},{"id":"thread","title":"Ariadne und der rote Faden","sub":"Ein Labyrinth. Ein mutiger Held. Eine noch bessere Idee.","symbol":"thread","tone":"coral","sections":[["Ein riesiges Rätsel","König Minos lässt Daidalos ein Labyrinth bauen. Darin lebt der Minotauros. Die Gänge sind so verwirrend, dass man den Ausgang kaum finden kann."],["Ariadne denkt voraus","Theseus will in das Labyrinth gehen. Ariadne hilft ihm: Sie gibt ihm ein Fadenknäuel. Ein Ende bindet er am Eingang fest. Beim Gehen rollt er den Faden ab."],["Zurück ins Licht","Theseus begegnet dem Minotauros und besiegt ihn. Jetzt kommt Ariadnes Idee zum Einsatz: Er folgt dem Faden durch die Gänge zurück zum Ausgang."],["Sage oder Geschichte?","Den Palast von Knossos kann man wirklich sehen. Das Labyrinth mit dem Minotauros gehört jedoch zur Sage. Viele verschachtelte Räume im Palast lassen uns verstehen, warum die Geschichte so gut zu Kreta passt."]],"think":"Wem verdankt Theseus den Rückweg? Und was würdest du als Wegzeichen benutzen?","people":["ariadne","theseus","minotauros","daidalos"],"source":["heroes","knossos"],"place":"knossos","note":null},{"id":"wings","title":"Ikaros und die Flügel","sub":"Eine grosse Erfindung – und ihre Grenzen.","symbol":"wing","tone":"aqua","sections":[["Eine Idee zum Wegfliegen","Daidalos und sein Sohn Ikaros wollen Kreta verlassen. Daidalos baut für beide Flügel aus Federn und Wachs. Das kann nur in einer Sage funktionieren."],["Die wichtige Warnung","Daidalos sagt: Fliege nicht zu hoch, sonst erwärmt die Sonne das Wachs. Und auch nicht zu tief, sonst macht das Meer die Federn nass. Ikaros soll in der Mitte bleiben."],["Zu nah an der Sonne","Zuerst klappt der Flug. Ikaros ist begeistert und steigt immer höher. In der Sage schmilzt das Wachs. Die Federn lösen sich. Ikaros stürzt ins Meer und stirbt. Daidalos ist sehr traurig."],["Darüber nachdenken","Die alte Geschichte erinnert daran, Warnungen ernst zu nehmen. Im wirklichen Leben ist die Luft in grosser Höhe meist kälter. Die Sage ist keine Erklärung dafür, wie Fliegen wirklich funktioniert."]],"think":"Wann hat dir schon einmal eine gute Warnung geholfen?","people":["ikaros","daidalos"],"source":["heroes"],"place":null,"note":"Diese Sage hat ein trauriges Ende. Du kannst sie auch mit einem Erwachsenen lesen."},{"id":"talos","title":"Talos, der Riesenwächter","sub":"Ein antiker Roboter auf Patrouille.","symbol":"robot","tone":"gold","sections":[["Ein Riese aus Metall","Stell dir vor, ein riesiger Mann aus Bronze stapft an der Küste entlang. So erzählten sich die Griechen die Geschichte von Talos, dem Wächter Kretas."],["Dreimal um die Insel","Talos soll Kreta jeden Tag dreimal umrundet haben. Wenn sich unerwünschte Schiffe näherten, hielt er sie mit gewaltigen Steinen fern. Er war kein sanfter Wächter."],["Auch Riesen sind verletzlich","Als die Argonauten nach Kreta kommen, treffen sie auf Talos. In den verschiedenen Fassungen wird er mit List bezwungen. Dabei spielt seine empfindliche Stelle am Fuss eine Rolle."],["Eine sehr alte Zukunftsidee","Talos erinnert an einen Roboter. Aber er ist eine Sagenfigur, keine ausgegrabene Maschine. Menschen stellten sich also schon sehr lange vor, dass künstliche Wesen Aufgaben übernehmen könnten."]],"think":"Welche freundliche Aufgabe würdest du einem Inselroboter geben?","people":["talos","hephaistos"],"source":["apollodorus"],"place":null,"note":null},{"id":"olive","title":"Athenes besonderer Baum","sub":"Manchmal ist das beste Geschenk etwas, das wächst.","symbol":"leaf","tone":"sage","sections":[["Zwei grosse Geschenke","Diese Geschichte spielt nicht auf Kreta, sondern in Athen. Athene und Poseidon wollen die Stadt beschützen. Beide machen ihr ein Geschenk."],["Wasser oder Baum?","Poseidon lässt in einer bekannten Fassung eine Salzwasserquelle entstehen. Athene schenkt einen Olivenbaum. Ein Baum sieht neben einem mächtigen Gott vielleicht unscheinbar aus."],["Ein Geschenk mit Zukunft","Der Olivenbaum liefert Früchte, Öl und Holz. Die Stadt entscheidet sich in der Sage für Athenes Geschenk. Darum verbindet man ihren Namen mit Athen."],["Und auf Kreta?","Auch auf Kreta begegnen dir Olivenbäume. Ihre kleinen Früchte werden zu Olivenöl gepresst. Die Geschichte kann dich daran erinnern, wie wertvoll ein Baum sein kann."]],"think":"Welches Geschenk hilft nicht nur heute, sondern noch in vielen Jahren?","people":["athene","poseidon"],"source":["apollodorus3","crete"],"place":null,"note":null},{"id":"seasons","title":"Demeter sucht Persephone","sub":"Eine alte Geschichte vom Wachsen und Wiederkommen.","symbol":"flower","tone":"rose","sections":[["Eine Tochter wird vermisst","Hades nimmt Persephone in die Unterwelt mit. Ihre Mutter Demeter sucht sie verzweifelt. Weil Demeter so traurig ist, lässt sie die Pflanzen nicht mehr wachsen."],["Die Götter müssen handeln","Ohne Ernte fehlt den Menschen das Essen. Zeus greift ein. Doch Persephone hat in der Unterwelt von einem Granatapfel gegessen. Das verbindet sie in der Sage mit diesem Ort."],["Zeit hier, Zeit dort","Es gibt eine Abmachung: Persephone lebt einen Teil des Jahres bei Demeter und einen Teil bei Hades. Wenn Mutter und Tochter zusammen sind, kehrt das Wachstum zurück."],["Die echte Erklärung","Mit solchen Geschichten versuchten Menschen, die Natur zu verstehen. Heute wissen wir: Die Jahreszeiten entstehen, weil die Erdachse schief steht, während die Erde um die Sonne zieht."]],"think":"Was verrät dir in der Natur, welche Jahreszeit gerade ist?","people":["demeter","persephone","hades","zeus"],"source":["hymndemeter"],"place":null,"note":null},{"id":"hermes","title":"Hermes und die erste Leier","sub":"Ein kleiner Gott mit einer grossen musikalischen Idee.","symbol":"lyre","tone":"lilac","sections":[["Ein ungewöhnliches Baby","Hermes ist in der Sage gerade erst geboren und schon voller Einfälle. Er macht aus einem Schildkrötenpanzer und Saiten eine Leier. Das ist ein Zupfinstrument."],["Ein ziemlich frecher Trick","Der kleine Hermes stiehlt Rinder, die Apollon gehören. Dabei versucht er, die Spuren zu verwischen. Apollon ist natürlich nicht begeistert."],["Musik statt Streit","Schliesslich kommen die beiden zusammen. Hermes spielt auf seiner Leier. Apollon ist von der Musik begeistert. Die Leier wird Teil ihrer Versöhnung."],["Klug und fair","Hermes steht für Schlauheit und neue Ideen. Seine Geschichte zeigt aber auch: Wer einen Streich spielt, muss sich danach mit den Folgen beschäftigen."]],"think":"Wie könnte man einen Streit ohne Kampf beenden?","people":["hermes","apollon"],"source":["hymnhermes"],"place":null,"note":null},{"id":"europa","title":"Europa und der weisse Stier","sub":"Eine sagenhafte Reise nach Kreta.","symbol":"boat","tone":"aqua","sections":[["Ein ungewöhnlicher Besucher","Europa ist eine Prinzessin. Eines Tages begegnet sie einem wunderschönen weissen Stier. Sie weiss nicht, dass sich Zeus in das Tier verwandelt hat."],["Über das Meer","Als Europa auf seinem Rücken sitzt, trägt der Stier sie ins Wasser und schwimmt bis nach Kreta. Das ist ein aufregender, aber auch unheimlicher Teil der Sage: Europa entscheidet nicht selbst über diese Reise."],["Eine neue Sagenfamilie","Auf Kreta ist Zeus wieder als Gott zu erkennen. In der Geschichte werden Europa und Zeus die Eltern von Minos. Der wird später mit Knossos verbunden."],["Nicht alles nachmachen","Verwandlungen und göttliche Abenteuer gehören zur Fantasie dieser alten Geschichten. Im echten Leben muss man Menschen fragen und ihre Entscheidung respektieren."]],"think":"Welche Figuren aus dieser Geschichte findest du auch im Stammbaum?","people":["europa","zeus","minos"],"source":["apollodorus3"],"place":null,"note":null}],"alphabet":[{"id":"0","upper":"Α","lower":"α","name":"Alpha","say":"άλφα","sound":"a","hint":"Wie das a in Mama.","word":"αστέρι","meaning":"Stern"},{"id":"1","upper":"Β","lower":"β","name":"Vita / Beta","say":"βήτα","sound":"w","hint":"Heute klingt Beta wie das deutsche w in Wasser, nicht wie b.","word":"βιβλίο","meaning":"Buch"},{"id":"2","upper":"Γ","lower":"γ","name":"Gamma","say":"γάμμα","sound":"g / j","hint":"Ein weiches, hinten im Mund gesprochenes g. Vor e- und i-Lauten klingt es etwa wie j.","word":"γάτα","meaning":"Katze"},{"id":"3","upper":"Δ","lower":"δ","name":"Delta","say":"δέλτα","sound":"dh","hint":"Ein stimmhafter Zungenlaut: Zungenspitze leicht zwischen die Zähne, dann summen. Wie englisch this.","word":"δώρο","meaning":"Geschenk"},{"id":"4","upper":"Ε","lower":"ε","name":"Epsilon","say":"έψιλον","sound":"e","hint":"Wie ein kurzes e.","word":"ελιά","meaning":"Olive"},{"id":"5","upper":"Ζ","lower":"ζ","name":"Zita / Zeta","say":"ζήτα","sound":"weiches s","hint":"Wie das summende s am Anfang von Sonne, nicht wie das deutsche z.","word":"ζάρι","meaning":"Würfel"},{"id":"6","upper":"Η","lower":"η","name":"Ita / Eta","say":"ήτα","sound":"i","hint":"Sieht gross aus wie ein H, klingt aber wie i.","word":"ήλιος","meaning":"Sonne"},{"id":"7","upper":"Θ","lower":"θ","name":"Thita / Theta","say":"θήτα","sound":"th","hint":"Zungenspitze dschaft.","facts":["An der schmalen Stelle, den sogenannten Pforten, stehen die Wände nur etwa drei Meter auseinander.","Hier lebt die kretische Wildziege, auch Kri-Kri genannt."],"look":"Die ganze Durchquerung ist eine lange, anstrengende Wanderung, kein kurzer Kinderspaziergang. Erwachsene planen Wetter, Weg und Ausrüstung.","source":["samaria"],"story":null},{"id":"rethymno","name":"Rethymno","greek":"Ρέθυμνο","kind":"Orte","lon":24.474,"lat":35.368,"desc":"Eine Stadt an der Nordküste mit einer Altstadt, einem kleinen Hafen und einer grossen Festung.","facts":["Die Festung heisst Fortezza.","Rethymno liegt zwischen Chania und Heraklion."],"look":"Zeige auf der Karte: Welche grosse Stadt liegt westlich, welche östlich?","source":["crete"],"story":null},{"id":"psiloritis","name":"Psiloritis","greek":"Ψηλορείτης","kind":"Natur","lon":24.771,"lat":35.226,"desc":"Der höchste Berg Kretas gehört zum Ida-Gebirge. Er zeigt: Kreta hat nicht nur Strände, sondern auch richtig hohe Berge.","facts":["Der höchste Gipfel ist etwa 2’456 Meter hoch.","Ida und Psiloritis sind Namen, die dir für dieses Berggebiet begegnen."],"look":"Stelle dir vor, du schaust von einem Strand bis zu einem hohen Gipfel. Was verändert sich unterwegs?","source":["crete"],"story":null},{"id":"matala","name":"Matala","greek":"Μάταλα","kind":"Orte","lon":24.75,"lat":34.993,"desc":"Ein Ort an der Südküste. Besonders auffällig sind die Höhlen in der hellen Felswand neben der Bucht.","facts":["Matala liegt am Libyschen Meer, südlich von Kreta.","Löcher und Höhlen im Fels machen die Küstenwand leicht wiedererkennbar."],"look":"Sieht die Felswand für dich wie ein riesiger Schweizer Käse aus?","source":["crete"],"story":null},{"id":"phaistos","name":"Phaistos","greek":"Φαιστός","kind":"Geschichte","lon":24.815,"lat":35.052,"desc":"Auch hier stand ein grosser minoischer Palast. Berühmt wurde der Ort durch eine kleine Tonscheibe mit rätselhaften Zeichen.","facts":["Auf dem Diskos von Phaistos sind die Zeichen wie eine Spirale angeordnet.","Die Zeichen wurden mit kleinen Stempeln in den noch weichen Ton gedrückt."],"look":"Die Scheibe ist echt. Was genau auf ihr steht, ist aber nicht sicher geklärt.","source":["disc"],"story":null},{"id":"heraklion","name":"Heraklion","greek":"Ηράκλειο","kind":"Orte","lon":25.135,"lat":35.339,"desc":"Die grösste Stadt Kretas liegt an der Nordküste. Ihr Archäologisches Museum bewahrt viele Dinge aus der minoischen Zeit.","facts":["Im Museum liegt der berühmte Diskos von Phaistos.","Knossos befindet sich nur ein Stück südlich der Stadt."],"look":"Was könnten Forschende aus einem kaputten Topf über frühere Menschen lernen?","source":["crete","disc"],"story":null},{"id":"knossos","name":"Knossos","greek":"Κνωσός","kind":"Geschichte","lon":25.163,"lat":35.298,"desc":"Der berühmteste minoische Palast Kretas. Hier treffen echte alte Mauern auf die Sagen von Minos, Ariadne und dem Minotauros.","facts":["Im Palast gab es viele Räume, Treppen und grosse Vorratsgefässe.","Teile, die du heute siehst, wurden später wieder aufgebaut. Nicht alles steht unverändert seit der Antike."],"look":"Echt ist der Palast. Der Minotauros und Ariadnes Faden gehören zur Sagenwelt.","source":["knossos"],"story":"thread"},{"id":"dikte","name":"Zeus-Höhle","greek":"Δικταίο Άντρο","kind":"Sagen","lon":25.446,"lat":35.162,"desc":"Die Höhle bei Psychro im Dikti-Gebirge wird mit der Geburt von Zeus verbunden. In ihr gibt es Tropfsteine und grosse unterirdische Räume.","facts":["Tropfsteine können von oben hängen oder von unten wachsen.","Auch andere Höhlen auf Kreta werden mit Zeus verbunden. Sagen haben verschiedene Fassungen."],"look":"Die Höhle ist echt. Dass Zeus hier als Baby lebte, gehört zur Sage. Öffnung und Zugang prüfen die Erwachsenen aktuell.","source":["cave"],"story":"babyzeus"},{"id":"agios","name":"Agios Nikolaos","greek":"Άγιος Νικόλαος","kind":"Orte","lon":25.718,"lat":35.19,"desc":"Eine Stadt im Osten Kretas. Mitten im Ort liegt der Voulismeni-See, der mit dem Meer verbunden ist.","facts":["Der Name der Stadt bedeutet Heiliger Nikolaus.","Die Bucht vor der Stadt heisst Mirabello."],"look":"Suche auf der Karte eine Stadt und eine Insel ganz in der Nähe.","source":["crete"],"story":null},{"id":"spinalonga","name":"Spinalonga","greek":"Σπιναλόγκα","kind":"Geschichte","lon":25.738,"lat":35.297,"desc":"Eine kleine Insel mit einer grossen Festung. Ihre Mauern stehen nahe bei Elounda im Osten Kretas.","facts":["Die Venezianer bauten hier eine starke Festung.","Später mussten hier viele Menschen mit einer schweren Krankheit getrennt von ihren Familien leben. Ihre Geschichten gehören auch zur Insel."],"look":"Mauern können schützen, aber auch trennen. Woran erkennst du eine Festung?","source":["spinalonga"],"story":null},{"id":"ierapetra","name":"Ierapetra","greek":"Ιεράπετρα","kind":"Orte","lon":25.737,"lat":35.01,"desc":"Eine Stadt direkt an der Südküste. Hier blickst du über das Libysche Meer in Richtung Afrika.","facts":["In Ierapetra steht die Festung Kales.","Vergleiche ihre Lage mit Agios Nikolaos: Die eine Stadt liegt südlich, die andere nördlich."],"look":"In welche Himmelsrichtung musst du von hier fahren, um zur Nordküste zu kommen?","source":["crete"],"story":null},{"id":"sitia","name":"Sitia","greek":"Σητεία","kind":"Orte","lon":26.104,"lat":35.207,"desc":"Eine Hafenstadt weit im Osten Kretas. Von hier ist es auf der Karte nicht mehr weit bis zu den Palmen von Vai.","facts":["Über der Stadt steht die Festung Kazarma.","Sitia schreibt man auf Griechisch mit den Buchstaben Σ Η Τ Ε Ι Α."],"look":"Tippe ΣΗΤΕΙΑ in der Wort-Werkstatt ein. Welche Buchstaben kennst du schon?","source":["crete"],"story":null},{"id":"vai","name":"Vai","greek":"Βάι","kind":"Natur","lon":26.262,"lat":35.253,"desc":"Ein Strand im Osten mit einem natürlichen Palmenwald dahinter. Das sieht anders aus als die felsigen Berge mitten auf der Insel.","facts":["Der Palmenwald ist ein geschützter Lebensraum.","Eine Piratengeschichte erklärt seine Entstehung als Sage. Sie ist kein naturwissenschaftlicher Beweis."],"look":"Warum sind Schatten und Wasser für Pflanzen und Tiere wichtig?","source":["vai"],"story":null},{"id":"zakros","name":"Zakros","greek":"Ζάκρος","kind":"Geschichte","lon":26.261,"lat":35.098,"desc":"Ganz im Osten liegen die Reste eines weiteren minoischen Palastes. Kreta hatte nicht nur ein einziges Palastzentrum.","facts":["Knossos, Phaistos und Zakros gehören zu den bekannten minoischen Palastorten.","Die Nähe zum Meer half beim Kontakt mit anderen Orten."],"look":"Was lässt sich mit einem Schiff leichter transportieren als zu Fuss?","source":["crete"],"story":null},{"id":"gavdos","name":"Gavdos","greek":"Γαύδος","kind":"Natur","lon":24.089,"lat":34.839,"desc":"Diese kleine Insel liegt südlich von Kreta. Sie gehört zur Region Kreta, ist aber eine eigene Insel.","facts":["Gavdos liegt weiter südlich als die grosse Insel Kreta.","Das Meer zwischen Inseln verbindet Orte – und trennt sie zugleich."],"look":"Zeige auf der Karte nach Norden: Dort liegt Kreta.","source":["crete"],"story":null}],"facts":[["Eine Insel mit Bergen","Kreta ist die grösste Insel Griechenlands. In ihrer Mitte ragen Gebirge auf; der höchste Gipfel ist ungefähr 2’456 Meter hoch.","mountain","aqua",["crete"]],["Eine Schrift als Rätsel","Der Diskos von Phaistos trägt gestempelte Zeichen in einer Spirale. Eine allgemein gesicherte Übersetzung gibt es nicht.","spiral","gold",["disc"]],["Kri-Kri klettern","Die kretische Wildziege ist in der felsigen Landschaft zuhause. Im Samaria-Gebiet ist sie eines der bekanntesten Tiere.","goat","sage",["samaria"]],["Palast oder Labyrinth?","Knossos ist eine echte Ausgrabungsstätte. Das Labyrinth des Minotauros gehört zur Sage. Beides auseinanderzuhalten macht dich zu einem guten Entdecker.","temple","coral",["knossos"]],["Eine Insel, viele Zeiten","Auf Kreta lebten im Lauf der Geschichte unterschiedliche Menschen. Minoische Paläste und venezianische Festungen stammen aus ganz verschiedenen Zeiten. const D=JSON.parse(document.getElementById('wiki-data').textContent);
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const searchNorm=s=>norm(s).replace(/\u00df/g,'ss');
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const byId=(list,id)=>list.find(x=>x.id===id);

const kinds={Goetter:'G\u00f6tter',Ursprung:'Die erste Familie',Menschen:'Heldinnen & Helden',Wesen:'Sagenwesen'};

function sourceDetails(ids){return `<details class="source-details"><summary>F\u00fcr Neugierige: Quellen</summary>${[...new Set(ids||[])].filter(id=>D.sources[id]).map(id=>`<a href="${esc(D.sources[id].url)}" target="_blank" rel="noopener noreferrer">${esc(D.sources[id].title)} \u2197</a>`).join('')}<p class="tiny" style="margin-top:10px">Links verlassen das Wiki und brauchen Internet.</p></details>`;}
function openModal(title,html){if(!modal.open){modalTrigger=document.activeElement;modal.showModal();document.body.style.overflow='hidden';}$('#modal-label').textContent=title;modalContent.innerHTML=html;modalContent.scrollTop=0;modal.querySelector('[data-act="close"]').focus({preventScroll:true});}
function closeModal(){stopSpeech();if(modal.open)modal.close();document.body.style.overflow='';if(modalTrigger?.isConnected)modalTrigger.focus({preventScroll:true});}
modal.addEventListener('cancel',e=>{e.preventDefault();closeModal();});
modal.addEventListener('click',e=>{if(e.target===modal){const r=modal.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal();}});
function navigate(page,tab,write=true){if(!defaults.hasOwnProperty(page))page='home';closeModal();state.page=page;state.tab=tab&&tabs[page]?.some(t=>t[0]===tab)?tab:defaults[page];state.quiz=null;if(write){const hash='#'+page+(state.tab?'/'+state.tab:'');try{history.pushState(null,'',hash);}catch(e){location.hash=hash;}}render();window.scrollTo({top:0,behavior:'instant'});}

function pageHead(eye,title,subtitle,extra=''){return `<div class="page-head"><div><div class="eyebrow">${eye}</div><h1>${title}</h1><p>${subtitle}</p></div>${extra?`<div class="actions">${extra}</div>`:''}</div>`;}
function render(){stopSpeech();$$('.nav-btn').forEach(b=>{const a=b.dataset.page===state.page;b.classList.toggle('active',a);b.setAttribute('aria-current',a?'page':'false');});main.classList.remove('section-enter');void main.offsetWidth;main.classList.add('section-enter');
 if(state.page==='home')renderHome();

 if(state.page==='island')renderIsland();

function attachMapGestures(){const svg=$('#island-map');if(!svg)return;const pointers=new Map();let drag=null,pinch=null,tapTarget=null,tapOrigin=null;
 svg.addEventListener('pointerdown',e=>{tapTarget=e.target.closest?.('.map-marker')?.dataset.id||null;tapOrigin={x:e.clientX,y:e.clientY};pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1)drag={x:e.clientX,y:e.clientY,c:{...state.camera},scale:svg.getScreenCTM()?.a||1};else if(pointers.size===2){const pts=[...pointers.values()];pinch={distance:Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y),c:{...state.camera}};drag=null;}try{svg.setPointerCapture(e.pointerId);}catch(err){}});
 svg.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2&&pinch){const pts=[...pointers.values()],dist=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y);if(dist<10)return;const w=Math.max(320,Math.min(1000,pinch.c.w*pinch.distance/dist));state.camera=clampCamera({x:pinch.c.x+(pinch.c.w-w)/2,y:pinch.c.y+(pinch.c.h-w*.44)/2,w,h:w*.44});suppressMapClick=Date.now()+400;applyCamera();}else if(pointers.size===1&&drag){const dx=(e.clientX-drag.x)/drag.scale,dy=(e.clientY-drag.y)/drag.scale;if(Math.abs(e.clientX-drag.x)+Math.abs(e.clientY-drag.y)>8)suppressMapClick=Date.now()+300;state.camera=clampCamera({...drag.c,x:drag.c.x-dx,y:drag.c.y-dy});applyCamera();}});
 const release=e=>{if(e.type==='pointerup'&&tapTarget&&tapOrigin&&Date.now()>=suppressMapClick&&Math.hypot(e.clientX-tapOrigin.x,e.clientY-tapOrigin.y)<8){choosePlace(tapTarget);suppressMapClick=Date.now()+280;}pointers.delete(e.pointerId);drag=null;pinch=null;tapTarget=null;tapOrigin=null;};svg.addEventListener('pointerup',release);svg.addEventListener('pointercancel',release);svg.addEventListener('lostpointercapture',release);
 svg.addEventListener('wheel',e=>{if(e.ctrlKey||e.metaKey){e.preventDefault();zoomMap(e.deltaY>0?1.12:.89);}},{passive:false});
 svg.addEventListener('keydown',e=>{if(e.target!==svg)return;const c=state.camera;if(e.key==='+'||e.key==='='){e.preventDefault();zoomMap(.8);}else if(e.key==='-'){e.preventDefault();zoomMap(1.25);}else if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();const step=c.w*.08;state.camera=clampCamera({...c,x:c.x+(e.key==='ArrowLeft'?-step:e.key==='ArrowRight'?step:0),y:c.y+(e.key==='ArrowUp'?-step:e.key==='ArrowDown'?step:0)});applyCamera();}});
}

/* Modern Greek: approximate reading help, never a claimed translation. */
function greekRead(input){
 const pairs={'\u03b1\u03b9':'e','\u03b5\u03b9':'i','\u03bf\u03b9':'i','\u03c5\u03b9':'i','\u03bf\u03c5':'u','\u03bc\u03c0':'b','\u03bd\u03c4':'d','\u03b3\u03ba':'g','\u03b3\u03b3':'ng','\u03c4\u03c3':'ts','\u03c4\u03b6':'ds'};
 const letters={'\u03b1':'a','\u03b2':'w','\u03b3':'gh','\u03b4':'dh','\u03b5':'e','\u03b6':'s','\u03b7':'i','\u03b8':'th','\u03b9':'i','\u03ba':'k','\u03bb':'l','\u03bc':'m','\u03bd':'n','\u03be':'ks','\u03bf':'o','\u03c0':'p','\u03c1':'r','\u03c3':'s','\u03c2':'s','\u03c4':'t','\u03c5':'i','\u03c6':'f','\u03c7':'ch','\u03c8':'ps','\u03c9':'o'};
 const s=String(input).toLocaleLowerCase('el').normalize('NFD').replace(/\u0301/g,'').normalize('NFC');let out='';
 for(let i=0;i<s.length;i++){let ch=s[i],next=s[i+1]||'',pair=ch+next;
  if(ch==='\u03ca'||ch==='\u03cb'){out+='i';continue;}
  if(pair==='\u03b1\u03c5'||pair==='\u03b5\u03c5'){const follow=s[i+2]||'';out+=(ch==='\u03b1'?'a':'e')+(/[\u03ba\u03c0\u03c4\u03be\u03c8\u03c3\u03c2\u03b8\u03c6\u03c7]/.test(follow)?'f':'w');i++;continue;}
  if(pairs[pair]){out+=pairs[pair];i++;continue;}
  if(ch==='\u03b3'&&(/[\u03b5\u03b7\u03b9\u03c5\u03ca\u03cb]/.test(next)||(next==='\u03b1'&&s[i+2]==='\u03b9'))){out+='j';continue;}
  out+=letters[ch]||ch;
 }return out;
}

function editEntry(kind,text=''){const el=$('#greek-entry');let start=el.selectionStart??state.entry.length,end=el.selectionEnd??start,value=state.entry;if(kind==='key'){if(value.length-(end-start)+text.length>120)return;value=value.slice(0,start)+text+value.slice(end);start+=text.length;}
 else if(kind==='backspace'){if(start===end&&start>0)start--;value=value.slice(0,start)+value.slice(end);}
 else if(kind==='clear'){value='';start=0;}
 else if(kind==='tonos'||kind==='diaeresis'){let chars=Array.from(value);let changed=false;const eligible=kind==='tonos'?/[\u03b1\u03b5\u03b7\u03b9\u03bf\u03c5\u03c9\u03b1-\u03c9]/i:/[\u03b9\u03c5]/i;for(let i=Math.max(0,start-1);i>=0;i--){const base=chars[i].normalize('NFD').replace(/[\u0300-\u036f]/g,'');if((kind==='tonos'?/[\u03b1\u03b5\u03b7\u03b9\u03bf\u03c5\u03c9]/i:eligible).test(base)){chars[i]=(base+(kind==='tonos'?'\u0301':'\u0308')).normalize('NFC');changed=true;break;}if(chars[i]===' ')break;}if(!changed){toast(kind==='tonos'?'Tippe zuerst einen Vokal an, zum Beispiel \u0391.':'Zwei Punkte passen auf \u0399 oder \u03a5.');return;}value=chars.join('');}
 state.entry=value;el.value=value;el.setSelectionRange(start,start);updateTranslation();}

function updateTranslation(){const value=state.entry.trim(),target=$('#translation');if(!value){target.innerHTML=`<div class="eyebrow">Deine Entdeckung erscheint hier</div><div class="empty-symbol" lang="el">\u03b3\u03b5\u03b9\u03b1!</div><h2 class="meaning">Was steht denn da?</h2><p class="explain">Tippe links die griechischen Zeichen an. Zum Beispiel \u039d + \u0395 + \u03a1 + \u039f. Dann verraten wir dir, was das Wort bedeutet.</p>`;return;}
 const variants=[...new Map(lexicon.filter(w=>norm(w.g)===norm(value)).map(w=>[w.g.normalize('NFC'),w])).values()];const exact=variants.find(w=>w.g.toLocaleLowerCase('el').normalize('NFC')===value.toLocaleLowerCase('el').normalize('NFC'));if(!exact&&variants.length>1){target.innerHTML=`<div class="eyebrow">Ein Akzent macht den Unterschied</div><div class="greek" lang="el">${esc(value)}</div><h2 class="meaning">Diese Buchstaben passen zu mehreren Wörtern.</h2><p class="explain">Tippe die passende Form an. Der Akzent zeigt, welche Silbe betont wird.</p><div class="suggestions">${variants.map(w=>`<button data-act="fillword" data-text="${esc(w.g)}"><strong lang="el">${esc(w.g)}</strong> · ${esc(w.d)}</button>`).join('')}</div>`;return;}const found=exact||variants[0];const greek=/[\u0370-\u03ff\u1f00-\u1fff]/.test(value);let body='';
 if(found){body=`<div class="eyebrow">Im Ferienw\u00f6rterbuch gefunden</div><div class="greek" lang="el">${esc(found.g)}</div><div class="meaning">${esc(found.d)}</div><div class="pronunciation"><span>Ungef\u00e4hre Lesehilfe</span><strong>${esc(found.p||greekRead(found.g))}</strong></div><div class="actions">${act(ico('sound')+'Griechisch anh\u00f6ren','say',`data-text="${esc(found.g)}" data-lang="el"`)}</div><p class="explain">${esc(found.note||(found.p?'Die Grossbuchstaben in dieser Lesehilfe zeigen die betonte Silbe. Die echte Aussprache kann etwas anders klingen.':'Eine vereinfachte Lesehilfe ohne genaue Betonungsangabe. Der Akzent im griechischen Wort zeigt die betonte Silbe.'))}</p>`;}
 else if(!greek){const matches=D.words.filter(w=>searchNorm(w.d).includes(searchNorm(value))).slice(0,5);body=`<div class="eyebrow">Du suchst auf Deutsch</div><div class="meaning">${matches.length?'Meinst du eines dieser W\u00f6rter?':'Griechische Zeichen gesucht'}</div><p class="explain">Mit den Tasten links kannst du griechische W\u00f6rter von Schildern nachbauen. Deutsch suchen geht auch im Ferienw\u00f6rterbuch darunter.</p><div class="suggestions">${matches.map(w=>`<button data-act="fillword" data-text="${esc(w.g)}"><span lang="el">${esc(w.g)}</span> \u00b7 ${esc(w.d)}</button>`).join('')}</div>`;}
 else {const tokens=norm(value).split(' '),known=tokens.filter(t=>wordMap.has(t));const suggestions=D.words.filter(w=>norm(w.g).startsWith(norm(value))).slice(0,4);body=`<div class="eyebrow">Noch nicht im Ferienw\u00f6rterbuch</div><div class="greek" lang="el">${esc(value)}</div><div class="meaning">Dieses Wort kenne ich noch nicht.</div><div class="pronunciation"><span>Nur Lesehilfe, keine \u00dcbersetzung</span><strong>${esc(greekRead(value))}</strong></div>${tokens.length>1&&known.length?`<p class="explain"><strong>Einzelne W\u00f6rter erkannt:</strong> ${known.map(t=>`${esc(wordMap.get(t).g)} = ${esc(wordMap.get(t).d)}`).join('; ')}. Das ergibt noch keine sichere Satz\u00fcbersetzung.</p>`:''}<div class="actions">${act(ico('sound')+'Anh\u00f6ren','say',`data-text="${esc(value)}" data-lang="el"`)}${act('Online nachschlagen \u2197','online')}</div><p class="explain">Die Lesehilfe ist vereinfacht. Frag einen Erwachsenen oder schau gemeinsam online nach.</p>${suggestions.length?`<div class="suggestions">${suggestions.map(w=>`<button data-act="fillword" data-text="${esc(w.g)}" lang="el">${esc(w.g)}</button>`).join('')}</div>`:''}`;}
 target.innerHTML=body;

function renderDictionary(){const q=searchNorm(state.wordQuery),items=lexicon.filter(w=>(state.wordCategory==='Alle'||w.c===state.wordCategory)&&searchNorm(w.g+' '+w.d+' '+w.p).includes(q));const unique=[...new Map(items.map(w=>[w.g.toLocaleLowerCase('el').normalize('NFC'),w])).values()];$('#dictionary').innerHTML=unique.slice(0,state.wordLimit).map(w=>`<button class="word-chip" data-act="fillword" data-text="${esc(w.g)}"><strong lang="el">${esc(w.g)}</strong><span>${esc(w.d)}</span></button>`).join('')||'<div class="no-results">Dazu ist noch kein Wort dabei. Versuche zum Beispiel Wasser, Eis oder Hallo.</div>';$('#dictionary-more').innerHTML=unique.length>state.wordLimit?act('Weitere W\u00f6rter entdecken','morewords'):`<span class="small muted">${unique.length} ${unique.length===1?'Eintrag':'Eintr\u00e4ge'} in dieser Auswahl.</span>`;}
function numberDots(n){if(!n)return '<span class="small muted">Keine Olive: Das ist null.</span>';if(n<=20)return Array.from({length:n},()=>'<span class="count-dot" aria-hidden="true"></span>').join('');return Array.from({length:Math.floor(n/10)},()=>'<span class="ten-dot" aria-hidden="true">10</span>').join('')+Array.from({length:n%10},()=>'<span class="count-dot" aria-hidden="true"></span>').join('');}
function renderNumbers(){$('#section-body').innerHTML=`<div class="number-layout"><section class="number-display" id="number-display"></section><section><div class="eyebrow" style="margin-bottom:12px">Eine Zahl antippen</div><div class="number-grid">${[...Array(21).keys(),30,40,50,60,70,80,90,100].map(n=>`<button class="number-key ${n===state.number?'active':''}" data-act="number" data-id="${n}" aria-pressed="${n===state.number}">${n}</button>`).join('')}</div><div class="notice content-gap"><strong>Die Ziffern kennst du schon!</strong> Im heutigen Griechenland stehen normalerweise auch 0, 1, 2, 3 auf Preisen und Schildern. Hier entdeckst du die griechischen <strong>W\u00f6rter</strong> daf\u00fcr.</div></section></div><div class="notice content-gap"><strong>Zum Z\u00e4hlen:</strong> Wir zeigen die Grundformen bis 100. Vor einem Nomen k\u00f6nnen manche Zahlw\u00f6rter anders aussehen. Zum Beispiel heisst \u00abein Euro\u00bb <span lang="el">\u03ad\u03bd\u03b1 \u03b5\u03c5\u03c1\u03ce</span>, aber \u00abein Mann\u00bb <span lang="el">\u03ad\u03bd\u03b1\u03c2 \u03ac\u03bd\u03c4\u03c1\u03b1\u03c2</span>.</div>${sourceDetails(['lexicon'])}`;setNumber(state.number);}
function setNumber(value){let n=Number(value);if(!Number.isInteger(n)||n<0||n>100){toast('W\u00e4hle eine ganze Zahl von 0 bis 100.');return;}state.number=n;const a=D.numbers[n],w=wordMap.get(norm(a.g));$('#number-display').innerHTML=`<div class="eyebrow">So z\u00e4hlt man auf Griechisch</div><div class="number">${n}</div><div class="greek" lang="el">${esc(a.g)}</div><div class="phonetic">${esc(w?.p||greekRead(a.g))}</div><div class="tiny muted">Ungef\u00e4hre Lesehilfe</div><div class="number-stepper">${act('\u2212','numberstep','data-step="-1" aria-label="Eine Zahl weniger"'+(n===0?' disabled':''))}<label><span class="sr-only">Zahl von 0 bis 100</span><input id="number-input" type="number" min="0" max="100" step="1" value="${n}" inputmode="numeric"></label>${act('+','numberstep','data-step="1" aria-label="Eine Zahl mehr"'+(n===100?' disabled':''))}</div><div class="number-dots" aria-label="${n} Oliven; Zehnerb\u00fcndel f\u00fcr gr\u00f6ssere Zahlen">${numberDots(n)}</div><div class="actions" style="justify-content:center">${act(ico('sound')+'Zahl anh\u00f6ren','say',`data-text="${esc(a.g)}" data-lang="el"`,'primary')}${act('W\u00fcrfel eine Zahl','randomnumber')}</div>`;$$('.number-key').forEach(b=>{const a=Number(b.dataset.id)===n;b.classList.toggle('active',a);b.setAttribute('aria-pressed',a);});}

let speechSession=0;
function updateSpeechButtons(active){$('#stop-speech').hidden=!active;const dock=$('#speech-dock');if(dock)dock.hidden=!active||modal.open;}
function stopSpeech(){speechSession++;if('speechSynthesis'in window)window.speechSynthesis.cancel();utterance=null;updateSpeechButtons(false);}
function sayText(text,lang='de'){if(!('speechSynthesis'in window)||!('SpeechSynthesisUtterance'in window)){toast('Dieser Browser bietet leider keine Vorlesestimme an. Der Text bleibt zum Lesen da.');return;}
 stopSpeech();voices=window.speechSynthesis.getVoices();const matching=voices.filter(v=>v.lang.toLowerCase().startsWith(lang));const voice=matching.find(v=>v.localService)||matching[0];if(!voice){toast(lang==='el'?'Auf diesem Ger\u00e4t ist gerade keine griechische Stimme verf\u00fcgbar. Nutze die Lesehilfe oder teste die Sprachausgabe in Safari.':'Auf diesem Ger\u00e4t ist gerade keine deutsche Vorlesestimme verf\u00fcgbar.');return;}
 const session=speechSession;const chunks=String(text).match(/[^.!?\n]+[.!?]?/g)||[String(text)];let i=0;updateSpeechButtons(true);
 const next=()=>{if(session!==speechSession)return;if(i>=chunks.length){utterance=null;updateSpeechButtons(false);return;}utterance=new SpeechSynthesisUtterance(chunks[i++]);utterance.lang=voice.lang;utterance.voice=voice;utterance.rate=lang==='el'?.81:.91;utterance.pitch=1;utterance.onend=next;utterance.onerror=e=>{if(session!==speechSession)return;updateSpeechButtons(false);if(e.error!=='interrupted'&&e.error!=='canceled')toast('Das Vorlesen hat nicht geklappt. Vielleicht ist die Stimme gerade nicht verf\u00fcgbar.');};window.speechSynthesis.speak(utterance);};next();}
function speakTopic(type,id){let text='';if(type==='god'){const g=byId(D.gods,id);if(g)text=[g.name,g.role,g.desc,'Das ist spannend.',g.fact,g.family].join('. ');}else if(type==='story'){const s=byId(D.stories,id);if(s)text=[s.title,s.note||'',...s.sections.flat(),s.think].join('. ');}else if(type==='place'){const p=byId(D.places,id);if(p)text=[p.name,p.desc,...p.facts,'Schau genau hin.',p.look].join('. ');}else if(type==='fact'){const f=D.facts[Number(id)];if(f)text=f[0]+'. '+f[1];}if(text)sayText(text,'de');}
function showInfo(){openModal('Willkommen im Kreta Kompass',`<article class="about-body"><div class="eyebrow">Ein kleines Wiki f\u00fcr grosse Neugier</div><h2>Du entscheidest, wohin die Reise geht.</h2><p>Hier gibt es keine Reihenfolge, keine Noten und keine Punkte. W\u00e4hle einfach etwas, das dich neugierig macht.</p><h3>G\u00f6tter &amp; Sagen</h3><p>Tippe eine Figur an, h\u00f6re eine Geschichte oder folge den Linien im Stammbaum. Die Erz\u00e4hlungen sind alte Sagen, keine Berichte \u00fcber wirkliche Ereignisse.</p><h3>Griechisch</h3><p>Jeder Buchstabe zeigt dir ein Beispiel. Baue in der Wort-Werkstatt W\u00f6rter mit den griechischen Tasten nach. Das Ferienw\u00f6rterbuch \u00fcbersetzt ausgew\u00e4hlte W\u00f6rter und Zahlw\u00f6rter bis 100. Die Lesehilfe ist nur ungef\u00e4hr. Bei unbekannten W\u00f6rtern kannst du mit einem Erwachsenen online nachschlagen.</p><h3>Die Insel</h3><p>Auf der Karte lassen sich ${D.places.length} Orte antippen. Du kannst die Karte vergr\u00f6ssern, mit zwei Fingern zoomen und verschieben. Unter der Karte stehen dieselben Orte als Liste. Beim Kartenr\u00e4tsel suchst du einen Ort anhand eines Hinweises.</p><h3>Vorlesen</h3><p>Vorlesen nutzt die Stimmen deines Ger\u00e4ts. F\u00fcr griechische W\u00f6rter braucht es eine verf\u00fcgbare griechische Stimme. Welche Stimmen und welche davon offline funktionieren, h\u00e4ngt vom Ger\u00e4t ab. Ist keine passende Stimme vorhanden, zeigen wir einen Hinweis statt einer falschen Aussprache.</p><h3>F\u00fcr die Reise</h3><p>Das Wiki ist im Querformat besonders \u00fcbersichtlich. Im GitHub-Paket ist eine Offline-Funktion enthalten: \u00d6ffnet die ver\u00f6ffentlichte Seite zuerst mit Internet. Sobald unten \u00abOffline bereit\u00bb steht, ist der Inhalt in diesem Browser gespeichert. In Safari k\u00f6nnt ihr die Seite \u00fcber Teilen zum Home-Bildschirm hinzuf\u00fcgen.</p><div class="notice content-gap"><strong>Vor der Abreise einmal im Flugmodus ausprobieren.</strong> Browser k\u00f6nnen gespeicherte Inhalte wieder entfernen. Quellenlinks, das Online-Nachschlagen und manche Vorlesestimmen brauchen weiterhin Internet. Die einzelne HTML-Datei enth\u00e4lt bereits alle Wiki-Inhalte und braucht daf\u00fcr keine externen Dateien.</div><h3>F\u00fcr Erwachsene</h3><p>Keine Anmeldung, keine Werbung, keine Lernhistorie und kein eingebautes Tracking. Eingaben werden in der App nur w\u00e4hrend der Sitzung verwendet. Beim bewusst gestarteten Online-Nachschlagen wird das eingegebene Wort an den ausgew\u00e4hlten externen Dienst \u00fcbergeben. Beim Hosting entstehen die \u00fcblichen technischen Serverzugriffe; Ger\u00e4testimmen k\u00f6nnen je nach Anbieter online arbeiten.</p><div class="actions content-gap">${act('Quellen & Hinweise','sources')}${act('Los, entdecken!','close','','primary')}</div></article>`);}
function showSources(){openModal('Quellen, Sagen und echte Inselgeschichten',`<article class="about-body"><div class="eyebrow">F\u00fcr Eltern und neugierige Entdecker</div><h2>Woher kommt das Wissen?</h2><p>Die Texte wurden f\u00fcr dieses Wiki neu und kindgerecht formuliert. Stand der inhaltlichen Pr\u00fcfung: 27. September 2026. Historische und geografische Erkl\u00e4rungen st\u00fctzen sich auf die folgenden Quellen.</p><div class="notice content-gap"><strong>Sage ist nicht Geschichte.</strong> G\u00f6tter, Helden und Sagenwesen stammen aus antiken Erz\u00e4hlungen. Verschiedene Autoren erz\u00e4hlen manchmal unterschiedliche Fassungen. Der Stammbaum zeigt eine bewusst vereinfachte Auswahl.</div>${Object.values(D.sources).map(s=>`<section class="source-row"><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.title)} \u2197</a><p>${esc(s.note)}</p></section>`).join('')}<h3>Karte und Gestaltung</h3><p>Die K\u00fcstenlinien sind aus GSHHG \u00fcber Basemap abgeleitet, vereinfacht und als bearbeitbare Koordinaten in dieser HTML-Datei enthalten. Datenlizenz: GNU Lesser General Public License, Version 3 oder neuer. Die Lizenzen sowie die Koordinaten liegen auch im GitHub-Paket. Die eigene Gestaltung und die Ortsmarken sind kein Karten- oder Navigationsdienst.</p><p class="content-gap"><a href="https://www.gnu.org/licenses/lgpl-3.0.html" target="_blank" rel="noopener noreferrer">LGPL-3.0-Lizenz lesen \u2197</a></p><h3>Besuche und Sicherheit</h3><p>Das Wiki nennt keine verbindlichen \u00d6ffnungszeiten, Eintrittspreise, Bootstermine oder Wegefreigaben. Schluchten, H\u00f6hlen, Str\u00e4nde und Berge besucht ihr nur mit Erwachsenen und aktueller Planung.</p><h3>Sprache</h3><p>Neugriechische Aussprache, keine Rekonstruktion der altgriechischen. Deutsche Lesehilfen sind bewusst vereinfacht und keine genaue Lautschrift. Das lokale W\u00f6rterbuch deckt ausgew\u00e4hlte Grundformen ab, nicht jede gebeugte Form und nicht alle S\u00e4tze. Externe \u00dcbersetzungen k\u00f6nnen ebenfalls Fehler enthalten.</p><p class="tiny content-gap">Alle Quellenlinks verlassen das Wiki. Daf\u00fcr wird Internet ben\u00f6tigt.</p></article>`);}
function showSearch(){openModal('Was m\u00f6chtest du entdecken?',`<div class="search-modal-body"><label class="search-field">${ico('search')}<input id="global-search" placeholder="Zeus, Palmen, Wasser ..." aria-label="Im ganzen Wiki suchen" autocomplete="off"></label><div id="search-results" aria-live="polite"></div></div>`);updateSearch('');setTimeout(()=>$('#global-search')?.focus(),80);}

 for(const g of D.gods)if(searchNorm([g.name,g.role,g.greek,g.desc,g.fact].join(' ')).includes(q))results.push({title:g.name,sub:g.role,symbol:g.symbol,action:'god',attr:`data-id="${g.id}"`});
 for(const s of D.stories)if(searchNorm([s.title,s.sub,...s.sections.flat()].join(' ')).includes(q))results.push({title:s.title,sub:'Eine alte Sage, neu erz\u00e4hlt',symbol:s.symbol,action:'story',attr:`data-id="${s.id}"`});
 for(const p of D.places)if(searchNorm([p.name,p.greek,p.desc,...p.facts].join(' ')).includes(q))results.push({title:p.name,sub:'Ein Ort auf Kreta',symbol:symbols[p.kind],action:'maplink',attr:`data-id="${p.id}"`});
 for(const a of D.alphabet)if(searchNorm([a.name,a.upper,a.lower].join(' ')).includes(q))results.push({title:a.upper+' '+a.lower+' \u00b7 '+a.name,sub:'Ein griechischer Buchstabe',symbol:'letters',action:'letterlink',attr:`data-id="${a.id}"`});
 const seen=new Set();for(const w of lexicon)if(!seen.has(norm(w.g))&&searchNorm(w.g+' '+w.d+' '+w.p).includes(q)){seen.add(norm(w.g));results.push({title:w.g,sub:w.d,symbol:w.c==='Zahlen'?'numbers':'letters',action:'fillword',attr:`data-text="${esc(w.g)}"`});}
 }
 $('#search-results').innerHTML=`<p class="small muted" style="margin:17px 0 3px">${q?(results.length?'Das haben wir gefunden:':'Noch nichts gefunden. Versuche einen anderen Namen oder ein einfaches Wort.'):'Ein paar Ideen zum Loslegen:'}</p>`+results.slice(0,45).map(r=>`<button class="search-result" data-act="${r.action}" ${r.attr}>${ico(r.symbol)}<span><strong>${esc(r.title)}</strong><small>${esc(r.sub)}</small></span></button>`).join('')+(results.length>45?'<p class="small muted content-gap">Es gibt noch mehr Treffer. Suche etwas genauer.</p>':'');}
function showOnline(){const word=state.entry.trim();if(!word)return;const url='https://translate.google.com/?sl=el&tl=de&text='+encodeURIComponent(word)+'&op=translate';openModal('Gemeinsam online nachschlagen',`<article class="about-body"><div class="eyebrow">Mit einem Erwachsenen</div><h2>Dieses Wort geht auf Reisen.</h2><div class="notice"><strong lang="el" style="font-size:27px;overflow-wrap:anywhere">${esc(word)}</strong></div><p class="content-gap">Der n\u00e4chste Knopf \u00f6ffnet Google \u00dcbersetzer in einem neuen Fenster und \u00fcbergibt genau dieses Wort. Daf\u00fcr brauchst du Internet. Im Wiki selbst wird nichts automatisch an einen \u00dcbersetzungsdienst geschickt.</p><p class="content-gap">Externe \u00dcbersetzungen k\u00f6nnen falsch sein. Schau dir die Antwort gemeinsam mit einem Erwachsenen an. Bitte keine Namen, Adressen oder anderen privaten Angaben eingeben.</p><div class="actions content-gap"><a class="btn primary" href="${esc(url)}" target="_blank" rel="noopener noreferrer">Google \u00dcbersetzer \u00f6ffnen \u2197</a>${act('Lieber im Wiki bleiben','close')}</div></article>`);}
function startMapRiddle(){state.mapGame={...pick(mapRiddles.filter(r=>r.id!==state.mapGame?.id))};state.mapFilter='Alle';state.camera={x:0,y:0,w:1000,h:440};renderIsland();}

document.addEventListener('click',e=>{const b=e.target.closest?.('[data-act]');if(!b||b.disabled)return;const a=b.dataset.act,id=b.dataset.id;
 switch(a){
 case'nav':navigate(b.dataset.page);break;
 case'tab':navigate(state.page,b.dataset.tab);break;
 case'god':openGod(id);break;case'story':openStory(id);break;case'close':closeModal();break;
 case'search':showSearch();break;case'info':showInfo();break;case'sources':showSources();break;
 case'stop':stopSpeech();break;case'say':sayText(b.dataset.text,b.dataset.lang||'de');break;case'speak':speakTopic(b.dataset.type,id);break;
 case'randomgod':openGod(pick(D.gods).id);break;
 case'randomfact':state.homeFact=(state.homeFact+1+Math.floor(Math.random()*(D.facts.length-1)))%D.facts.length;renderHome();break;
 case'surprise':{const n=Math.floor(Math.random()*3);if(n===0)openGod(pick(D.gods).id);else if(n===1)openStory(pick(D.stories).id);else goMap(pick(D.places).id);break;}
 case'mythfilter':state.mythFilter=id;renderMyth();break;case'treebranch':state.tree=id;renderTree();break;
 case'letter':selectLetter(id);break;case'letterlink':state.letter=Number(id);navigate('greek','alphabet');break;case'pair':openPair(id);break;
 case'fillword':fillWord(b.dataset.text);break;
 case'key':editEntry('key',b.dataset.text);break;case'backspace':editEntry('backspace');break;case'clearword':editEntry('clear');break;
 case'tonos':editEntry('tonos');break;case'diaeresis':editEntry('diaeresis');break;
 case'lookup':updateTranslation();if(window.innerWidth<761&&window.innerHeight>540)$('#translation').scrollIntoView({behavior:'smooth',block:'start'});break;
 case'kbdcase':state.kbdLower=!state.kbdLower;renderKeyboard();$('#kbd-case').textContent=state.kbdLower?'ABC / Gross':'abc / Klein';break;
 case'devicekbd':{const input=$('#greek-entry');input.inputMode=input.inputMode==='none'?'text':'none';input.focus();toast(input.inputMode==='none'?'Die Bildschirmtasten im Wiki sind aktiv.':'Du kannst jetzt mit deiner Ger\u00e4tetastatur schreiben oder ein Wort einf\u00fcgen.');break;}
 case'morewords':state.wordLimit+=36;renderDictionary();break;case'online':showOnline();break;
 case'number':setNumber(Number(id));break;case'numberstep':setNumber(state.number+Number(b.dataset.step));break;case'randomnumber':setNumber(Math.floor(Math.random()*101));break;
 case'quizmode':state.quizMode=id;state.quiz=null;renderQuiz('greek');break;case'quizrange':state.quizRange=state.quizRange===20?100:20;state.quiz=null;renderQuiz('greek');break;
 case'quiznext':{state.quiz=null;renderQuiz(state.page==='myth'?'myth':state.page==='island'?'island':'greek');break;}
 case'answer':answerQuiz(Number(id));break;
 case'maplink':goMap(id);break;
 case'place':if(Date.now()>=suppressMapClick)choosePlace(id);break;
 case'mapfilter':{state.mapFilter=id;if(!filteredPlaces().some(p=>p.id===state.place))state.place=filteredPlaces()[0].id;renderMapPage();break;}
 case'mapzoom':zoomMap(Number(b.dataset.factor));break;case'mapreset':state.camera={x:0,y:0,w:1000,h:440};applyCamera();break;
 case'mapgame':if(state.mapGame){state.mapGame=null;renderIsland();}else startMapRiddle();break;
 case'mapnext':startMapRiddle();break;
 case'facttoggle':{const content=$('#fact-'+id);content.hidden=!content.hidden;b.setAttribute('aria-expanded',!content.hidden);break;}
 }
});
document.addEventListener('input',e=>{const el=e.target;if(el.id==='myth-search'){state.mythQuery=el.value;updateMythGrid();}else if(el.id==='greek-entry'){state.entry=el.value;updateTranslation();}else if(el.id==='word-search'){state.wordQuery=el.value;state.wordLimit=36;renderDictionary();}else if(el.id==='global-search')updateSearch(el.value);});
document.addEventListener('change',e=>{if(e.target.id==='word-category'){state.wordCategory=e.target.value;state.wordLimit=36;renderDictionary();}else if(e.target.id==='number-input')setNumber(e.target.value);});
document.addEventListener('keydown',e=>{const role=e.target.closest?.('[role="button"][data-act]');if(role&&(e.key==='Enter'||e.key===' ')){e.preventDefault();role.dispatchEvent(new MouseEvent('click',{bubbles:true}));}if(e.target.id==='greek-entry'&&e.key==='Enter'){e.preventDefault();updateTranslation();}});
window.addEventListener('popstate',parseRoute);
window.addEventListener('hashchange',()=>{const path='#'+state.page+(state.tab?'/'+state.tab:'');if(location.hash!==path)parseRoute();});
if('speechSynthesis'in window){voices=window.speechSynthesis.getVoices();window.speechSynthesis.addEventListener?.('voiceschanged',()=>{voices=window.speechSynthesis.getVoices();});}
window.addEventListener('pagehide',stopSpeech);
function offlineStatus(message){$('#offline-label').innerHTML='<span class="badge-dot"></span> '+esc(message);}
async function prepareOffline(){if(location.protocol==='file:'){offlineStatus('Inhalt in dieser Datei');return;}if(!('serviceWorker'in navigator)||!window.isSecureContext){offlineStatus('Ohne Konto');return;}
 try{const registration=await navigator.serviceWorker.register('./sw.js',{scope:'./'});await navigator.serviceWorker.ready;const c=await caches.open('kreta-kompass-v1.0-'+registration.scope);const cached=await c.match(new URL('index.html',registration.scope).href);if(cached)offlineStatus(navigator.onLine?'Offline bereit':'Offline unterwegs');else offlineStatus('Ohne Konto');}catch(e){offlineStatus('Ohne Konto');}}
window.addEventListener('online',prepareOffline);window.addEventListener('offline',()=>{if($('#offline-label').textContent.includes('Offline'))offlineStatus('Offline unterwegs');});
parseRoute();
if(document.querySelector('meta[name="kreta-package"]'))prepareOffline();else if(location.protocol==='file:')offlineStatus('Inhalt in dieser Datei');

</script>
</body></html>
